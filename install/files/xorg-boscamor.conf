# Written by the launcher installer (D105). X starts the TV at 1920 x 1080 at
# 60 Hz, the CEA-861 timing, not at the TV's own preferred mode: a 4K TV
# prefers 3840 x 2160 at 60 Hz, and after a restart the J4105 fell behind at
# that mode while the desktop started (FIFO underruns), which left the DP to
# HDMI adapter with no signal. The launcher's Picture setting decides once it
# is up. X gives a Monitor section to the output with the same name, so there
# is one for each of the box's outputs. Remove this file to undo.
Section "Monitor"
	Identifier "DP-1"
	Modeline "1920x1080_start" 148.50 1920 2008 2052 2200 1080 1084 1089 1125 +hsync +vsync
	Option "PreferredMode" "1920x1080_start"
EndSection

Section "Monitor"
	Identifier "DP-2"
	Modeline "1920x1080_start" 148.50 1920 2008 2052 2200 1080 1084 1089 1125 +hsync +vsync
	Option "PreferredMode" "1920x1080_start"
EndSection

