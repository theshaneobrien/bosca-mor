<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings, apps</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1920px; height: 1080px; overflow: hidden; box-sizing: border-box; padding: 56px 120px 52px; background: #0c0c14; color: #f2f2f7; font-family: 'DM Sans', system-ui, sans-serif; display: flex; flex-direction: column">

<header style="display: flex; justify-content: space-between; align-items: center">
<h1 style="margin: 0; font-size: 60px; line-height: 1; font-weight: 700; letter-spacing: -0.02em">Settings</h1>
<div style="display: flex; align-items: center; gap: 44px; font-size: 26px; color: #a3a3b8">
<span style="display: flex; align-items: center; gap: 12px"><kbd style="display: inline-flex; align-items: center; justify-content: center; width: 46px; height: 46px; border-radius: 23px; background: #2a2a3c; color: #f2f2f7; font-family: 'DM Mono', monospace; font-size: 21px; font-weight: 500">A</kbd>Show or hide</span>
<span style="display: flex; align-items: center; gap: 12px"><kbd style="display: inline-flex; align-items: center; justify-content: center; width: 46px; height: 46px; border-radius: 23px; background: #2a2a3c; color: #f2f2f7; font-family: 'DM Mono', monospace; font-size: 21px; font-weight: 500">Y</kbd>Move</span>
<a href="Main.dc.html" style="display: flex; align-items: center; gap: 12px; color: #a3a3b8; text-decoration: none"><kbd style="display: inline-flex; align-items: center; justify-content: center; width: 46px; height: 46px; border-radius: 23px; background: #2a2a3c; color: #f2f2f7; font-family: 'DM Mono', monospace; font-size: 21px; font-weight: 500">B</kbd>Back</a>
</div>
</header>

<div style="flex: 1; min-height: 0; margin-top: 48px; display: flex; gap: 64px">

<nav aria-label="Settings sections" style="flex: none; width: 400px; display: flex; flex-direction: column; gap: 6px">
<a href="#apps" aria-current="page" style="display: flex; align-items: center; height: 76px; padding: 0 28px; border-radius: 18px; background: #f2f2f7; color: #0c0c14; font-size: 30px; font-weight: 700; text-decoration: none">Apps</a>
<a href="#display" style="display: flex; align-items: center; height: 76px; padding: 0 28px; border-radius: 18px; color: #d6d6e0; font-size: 30px; font-weight: 500; text-decoration: none">Display</a>
<a href="#network" style="display: flex; align-items: center; height: 76px; padding: 0 28px; border-radius: 18px; color: #d6d6e0; font-size: 30px; font-weight: 500; text-decoration: none">Network</a>
<a href="#sound" style="display: flex; align-items: center; height: 76px; padding: 0 28px; border-radius: 18px; color: #d6d6e0; font-size: 30px; font-weight: 500; text-decoration: none">Sound</a>
<a href="#controllers" style="display: flex; align-items: center; height: 76px; padding: 0 28px; border-radius: 18px; color: #d6d6e0; font-size: 30px; font-weight: 500; text-decoration: none">Controllers</a>
<a href="#startup" style="display: flex; align-items: center; height: 76px; padding: 0 28px; border-radius: 18px; color: #d6d6e0; font-size: 30px; font-weight: 500; text-decoration: none">Startup</a>
<a href="#about" style="display: flex; align-items: center; height: 76px; padding: 0 28px; border-radius: 18px; color: #d6d6e0; font-size: 30px; font-weight: 500; text-decoration: none">About</a>
</nav>

<section id="apps" style="flex: 1; min-width: 0; display: flex; flex-direction: column">
<div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 32px">
<div>
<h2 style="margin: 0; font-size: 44px; line-height: 1.1; font-weight: 700">Apps on Home</h2>
<p style="margin: 10px 0 0; font-size: 28px; color: #a3a3b8">Shown left to right in this order.</p>
</div>
<button style="flex: none; height: 72px; margin: 0; padding: 0 32px; border: 2px solid #3a3a52; border-radius: 18px; background: transparent; color: #f2f2f7; font: inherit; font-size: 28px; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 14px">
<svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>Add app</button>
</div>

<div style="margin-top: 32px; display: flex; flex-direction: column; gap: 4px">
<sc-for list="{{apps}}" as="app" hint-placeholder-count="8">
<div style="{{app.rowStyle}}">
<svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#6c6c86" stroke-width="2" stroke-linecap="round"><path d="M5 9h14M5 15h14"></path></svg>
<span style="{{app.tileStyle}}">
<svg aria-hidden="true" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{app.d}}"></path></svg>
</span>
<span style="flex: 1; min-width: 0; font-size: 28px; font-weight: 500">{{app.name}}</span>
<sc-if value="{{app.hasUrl}}" hint-placeholder-val="{{ false }}">
<button style="flex: none; height: 44px; margin: 0 16px 0 0; padding: 0 18px; border: 2px solid #3a3a52; border-radius: 12px; background: transparent; color: #d6d6e0; font-family: 'DM Mono', monospace; font-size: 20px; cursor: pointer">Start page: {{app.url}}</button>
</sc-if>
<span style="font-family: 'DM Mono', monospace; font-size: 22px; letter-spacing: 0.1em; text-transform: uppercase; color: #a3a3b8">{{app.kind}}</span>
<button aria-pressed="true" aria-label="Show {{app.name}} on Home" style="flex: none; width: 76px; height: 42px; margin: 0 0 0 24px; padding: 0 5px; border: 0; border-radius: 21px; background: #3cc4a8; cursor: pointer; display: flex; align-items: center; justify-content: flex-end">
<span style="display: block; width: 32px; height: 32px; border-radius: 16px; background: #0c0c14"></span>
</button>
</div>
</sc-for>
</div>
</section>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"focusRow":{"editor":"int","min":0,"max":9,"default":5},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    const APPS = [
      { name: 'YouTube', kind: 'Video', accent: '#ff7a6b', tint: '#2d1719', d: 'M3 6.5A2.5 2.5 0 0 1 5.5 4h13A2.5 2.5 0 0 1 21 6.5v11a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5zM10 9l5 3-5 3z' },
      { name: 'Plex', kind: 'Video', accent: '#ffc94d', tint: '#2b2513', d: 'M9 5l8 7-8 7' },
      { name: 'Jellyfin', kind: 'Video', accent: '#5fdcea', tint: '#10262b', d: 'M4 4h16v16H4zM8 4v16M16 4v16M4 9h4M4 15h4M16 9h4M16 15h4' },
      { name: 'Netflix', kind: 'Video', accent: '#3cc4a8', tint: '#0f2622', d: 'M4 10h16v10H4zM4 10l1.5-5.5h15L19 10M9.5 4.5L8 10M15 4.5L13.5 10' },
      { name: 'Prime Video', kind: 'Video', accent: '#ffc94d', tint: '#2b2513', d: 'M12 21a9 9 0 1 0 0-18a9 9 0 1 0 0 18M10 8.5l5 3.5-5 3.5z' },
      { name: 'Browser', kind: 'Web', accent: '#5fdcea', tint: '#10262b', url: 'google.com', d: 'M12 21a9 9 0 1 0 0-18a9 9 0 1 0 0 18M3 12h18M12 3c2.5 2.5 3.5 5.5 3.5 9s-1 6.5-3.5 9c-2.5-2.5-3.5-5.5-3.5-9s1-6.5 3.5-9' },
      { name: 'Spotify', kind: 'Music', accent: '#3cc4a8', tint: '#0f2622', d: 'M9 18V6l10-2v12M9 18a3 3 0 1 1-6 0a3 3 0 1 1 6 0M19 16a3 3 0 1 1-6 0a3 3 0 1 1 6 0' },
      { name: 'Alaris Music', kind: 'Music', accent: '#ff7a6b', tint: '#2d1719', d: 'M6 3h12v18H6zM12 17a3 3 0 1 0 0-6a3 3 0 1 0 0 6M11 7h2' },
      { name: 'Moonlight', kind: 'Games', accent: '#ffc94d', tint: '#2b2513', d: 'M3 4h18v12H3zM8 20h8M12 16v4M10 7.5l4.5 2.5-4.5 2.5z' },
      { name: 'RetroArch', kind: 'Games', accent: '#5fdcea', tint: '#10262b', d: 'M6 8h12a4 4 0 0 1 4 4v1a4 4 0 0 1-7 2.6L14 15h-4l-1 .6A4 4 0 0 1 2 13v-1a4 4 0 0 1 4-4zM7 10.5v3M5.5 12h3M16 11h.01M18 13h.01' }
    ];
    const focusRow = this.props.focusRow ?? 5;
    const apps = APPS.map((a, i) => {
      const on = i === focusRow;
      return Object.assign({}, a, {
        rowStyle: 'display:flex;align-items:center;gap:24px;height:64px;padding:0 28px 0 20px;border-radius:16px;' + (on ? 'background:#1c1c2a;box-shadow:inset 0 0 0 3px #f2f2f7;' : 'background:transparent;box-shadow:none;'),
        tileStyle: 'flex:none;display:flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:12px;background:' + a.tint + ';color:' + a.accent,
        hasUrl: !!a.url,
        url: a.url || ''
      });
    });
    return { apps };
  }
}
</script>
</body>
</html>
